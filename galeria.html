<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria do Destino - Lâminas</title>
    <link rel="shortcut icon" href="/public/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/galeria.css">
    <link rel="stylesheet" href="/css/animacoes.css">
</head>
<body class="bg-dark text-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-warning" style="border-width: 2px !important;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <span style="color: #FFD700;">⚔️</span> Lâminas do Destino
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/galeria">Galeria</a>
                    </li>
                    <li class="nav-item dropdown" id="navNotificacoesContainer" style="display: none;">
                        <a class="nav-link dropdown-toggle" href="#" id="navNotificacoes" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            🔔 <span id="badgeNotificacoes" class="badge bg-danger">0</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end bg-black border-warning" aria-labelledby="navNotificacoes" style="min-width: 320px;">
                            <li><h6 class="dropdown-header text-warning">Notificações</h6></li>
                            <li><div id="listaNotificacoes" class="px-3"></div></li>
                            <li><hr class="dropdown-divider"></li>
                            <li class="px-3"><a href="/perfil" class="text-warning">Ver todas</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="navPerfil" href="/perfil" style="display: none;">Perfil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="navSair" href="#" onclick="sair()" style="display: none;">Sair</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="navEntrar" href="/login.html" style="display: none;">Entrar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Container Principal -->
    <div class="container-fluid py-5">
        <div class="row">
            <!-- Sidebar - Filtros -->
            <div class="col-lg-3 mb-4">
                <div class="card bg-black border-warning shadow-lg">
                    <div class="card-body">
                        <h5 class="card-title mb-4">
                            <span style="color: #FFD700;">🔍</span> Filtros
                        </h5>

                        <!-- Busca -->
                        <div class="mb-4">
                            <label class="form-label">Buscar Narrativas</label>
                            <input 
                                type="text" 
                                class="form-control bg-dark border-warning text-light" 
                                id="buscaInput" 
                                placeholder="Título, autor..."
                            >
                        </div>

                        <!-- Filtro por Gênero -->
                        <div class="mb-4">
                            <label class="form-label">Gênero</label>
                            <select class="form-select bg-dark border-warning text-light" id="generoSelect">
                                <option value="">Todos os gêneros</option>
                                <option value="fantasia">🐉 Fantasia</option>
                                <option value="ficção-científica">🚀 Ficção Científica</option>
                                <option value="mistério">🔍 Mistério</option>
                                <option value="romance">💕 Romance</option>
                                <option value="horror">👻 Horror</option>
                                <option value="aventura">🗺️ Aventura</option>
                                <option value="outro">📖 Outro</option>
                            </select>
                        </div>

                        <!-- Botões de Ação -->
                        <div class="d-grid gap-2">
                            <button class="btn btn-warning fw-bold mb-2" id="btnAplicarFiltros">
                                ✓ Aplicar Filtros
                            </button>
                            <button class="btn btn-outline-warning" id="btnLimparFiltros">
                                ↺ Limpar Filtros
                            </button>
                        </div>

                        <hr class="border-warning">

                        <!-- Estatísticas -->
                        <div class="mt-4">
                            <h6 class="mb-3">📊 Estatísticas</h6>
                            <div class="small text-warning">
                                <p id="totalNarrativas">Carregando narrativas...</p>
                                <p id="totalComentarios">Calculando comentários...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Card Info Usuário -->
                <div class="card bg-black border-warning shadow-lg mt-4" id="cardUsuario" style="display: none;">
                    <div class="card-body text-center">
                        <img id="avatarUsuario" src="" alt="Avatar" class="rounded-circle mb-3" width="80" height="80">
                        <h6 id="nomeUsuario" class="text-warning"></h6>
                        <small id="nivelUsuario" class="text-muted"></small>
                        <button class="btn btn-sm btn-warning mt-3 w-100" onclick="irPara('/perfil')">
                            👤 Meu Perfil
                        </button>
                    </div>
                </div>
            </div>

            <!-- Main Content - Narrativas -->
            <div class="col-lg-9">
                <!-- Cards de Narrativas -->
                <div id="containerNarrativas" class="row g-4">
                    <div class="col-12 text-center">
                        <div class="spinner-border text-warning" role="status">
                            <span class="visually-hidden">Carregando...</span>
                        </div>
                    </div>
                </div>

                <!-- Paginação -->
                <nav id="paginacao" class="mt-5" style="display: none;">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" id="btnAnterior">
                            <a class="page-link bg-black text-warning border-warning" href="#">← Anterior</a>
                        </li>
                        <li class="page-item disabled">
                            <span class="page-link bg-black text-warning border-warning">
                                Página <span id="paginaAtual">1</span> de <span id="totalPaginas">1</span>
                            </span>
                        </li>
                        <li class="page-item" id="btnProximo">
                            <a class="page-link bg-black text-warning border-warning" href="#">Próximo →</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Modal de Comentários -->
    <div class="modal fade" id="modalComentarios" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable modal-lg">
            <div class="modal-content bg-black border-warning">
                <div class="modal-header border-warning">
                    <h5 class="modal-title text-warning">💬 Comentários</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Input de novo comentário -->
                    <div class="mb-4" id="formaComentario" style="display: none;">
                        <div class="input-group">
                            <input 
                                type="text" 
                                class="form-control bg-dark border-warning text-light" 
                                id="inputComentario"
                                placeholder="Compartilhe sua opinião..."
                            >
                            <button class="btn btn-warning" id="btnAdicionarComentario">
                                ➤ Enviar
                            </button>
                        </div>
                    </div>

                    <!-- Lista de comentários -->
                    <div id="listaComentarios">
                        <div class="text-center text-muted">
                            <div class="spinner-border text-warning" role="status">
                                <span class="visually-hidden">Carregando...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/galeria.js"></script>
    <script src="/js/notificacoes.js"></script>
    <script src="/js/animacoes.js"></script>
</body>
</html>
