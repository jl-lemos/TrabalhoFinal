<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Entrar — Lâminas do Destino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/animacoes.css">
</head>
<body class="bg-dark text-light">
    <nav class="navbar navbar-dark bg-black border-bottom border-warning">
        <div class="container">
            <a class="navbar-brand text-warning" href="/">⚔️ Lâminas do Destino</a>
            <div>
                <a class="btn btn-outline-warning" href="/register.html">Criar conta</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card bg-black border-warning">
                    <div class="card-body">
                        <h3 class="card-title text-warning">Entrar</h3>
                        <form id="loginPageForm">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" id="loginEmail" class="form-control bg-dark text-light border-warning" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Senha</label>
                                <input type="password" id="loginSenha" class="form-control bg-dark text-light border-warning" required>
                            </div>
                            <button class="btn btn-warning w-100" type="submit">Entrar</button>
                        </form>
                        <hr class="border-warning">
                        <p class="text-center">Ainda não tem conta? <a href="/register.html" class="text-warning">Crie aqui</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/animacoes.js"></script>
    <script>
        document.getElementById('loginPageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;
            try {
                await auth.login({ email, senha });
                window.location.href = '/perfil';
            } catch (err) {
                alert('Erro ao entrar: ' + (err.message || err));
            }
        });
    </script>
</body>
</html>
